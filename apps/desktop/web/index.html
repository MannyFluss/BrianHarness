<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch / home indicator; layout pads with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- connect-src is filled in by vite.config.ts (webCsp): 'self', Ollama on :11434 (any LAN host),
         OpenAI, Anthropic, OpenRouter, plus origins from BH_CONNECT_SRC at build time. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src %CONNECT_SRC%; manifest-src 'self'; base-uri 'self'; form-action 'none'" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>%BRAND_NAME%</title>
  </head>
  <body class="min-h-dvh antialiased">
    <div id="root"></div>
    <script type="module" src="../src/main.web.tsx"></script>
  </body>
</html>
