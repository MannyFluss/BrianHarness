# Packaging sketch for Manny's Mac (arm64). Run ON the Mac: npm run dist:mac -w @brianharness/desktop
appId: dev.mannyfluss.eegharness
productName: EEG Harness
executableName: eeg-harness
directories:
  output: release
files:
  - electron/**
  - dist/**
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  # unsigned local build by default; set identity + notarize (Apple Developer ID) for distribution
  identity: null
